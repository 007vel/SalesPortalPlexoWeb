<h2 mat-dialog-title>Add training material</h2>
<mat-dialog-content>
  <p class="sub">Share a video, image, or PDF with the team. It appears in the Training &amp; Resource Hub for everyone.</p>

  <div class="file-pick">
    <mat-icon>{{ isVideo() ? 'movie' : 'upload_file' }}</mat-icon>
    <div class="fp-txt">
      <b>File</b>
      <span>{{ pendingFileName() ?? 'No file chosen yet.' }}</span>
    </div>
    <button type="button" mat-stroked-button (click)="fileInput.click()">Choose file</button>
    <input #fileInput type="file" accept="video/*,image/*,application/pdf" class="hidden-file-input" (change)="handleFile($event)">
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Title *</mat-label>
      <input matInput formControlName="title" placeholder="Live call walkthrough — renewal pitch">
    </mat-form-field>

    <div class="field-row" [class.single]="!isVideo()">
      <mat-form-field appearance="outline">
        <mat-label>Category *</mat-label>
        <input matInput formControlName="category" placeholder="e.g. Team Uploads">
      </mat-form-field>
      @if (isVideo()) {
      <mat-form-field appearance="outline">
        <mat-label>Length (optional)</mat-label>
        <input matInput formControlName="duration" placeholder="12 min">
      </mat-form-field>
      }
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Short description</mat-label>
      <input matInput formControlName="description" placeholder="What this covers, in one line">
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [disabled]="submitting()" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" class="submit-btn" [disabled]="submitting()" (click)="submit()">
    @if (uploaded()) {
    <mat-icon>check</mat-icon>
    } @else if (submitting()) {
    <mat-progress-spinner mode="indeterminate" diameter="24" strokeWidth="3"></mat-progress-spinner>
    }
    @if (uploaded()) {
    <span>Added</span>
    } @else if (submitting()) {
    <span>Adding…</span>
    } @else {
    <span>Add to hub</span>
    }
  </button>
</mat-dialog-actions>
